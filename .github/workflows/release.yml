name: Release

# Push a tag like v1.0.0 (matching appVersionName in app/build.gradle) to build, sign and
# draft a GitHub release. The draft is published by hand after checking it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches the version in app/build.gradle
        run: |
          version=$(sed -n "s/^def appVersionName = '\(.*\)'$/\1/p" app/build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match appVersionName $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. See release/SIGNING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test, lint and build the signed release
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and write checksums
        run: |
          apk="app/build/outputs/apk/release/AttendEase-v$VERSION.apk"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs --min-sdk-version 21 "$apk" | tee signature.txt
          grep -q "Verified using v1 scheme (JAR signing): true" signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt
          cert=$(grep -m1 "certificate SHA-256 digest" signature.txt | sed 's/.*digest: //')
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")") > "AttendEase-v$VERSION.apk.sha256"
          code=$(echo "$VERSION" | awk -F. '{print $1*10000 + $2*100 + $3}')
          {
            echo "## AttendEase $VERSION"
            echo
            cat "fastlane/metadata/android/en-US/changelogs/$code.txt" 2>/dev/null || true
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md) for details. Requires Android 5.0 or newer."
            echo
            echo "**APK SHA-256:** \`$(cut -d' ' -f1 "AttendEase-v$VERSION.apk.sha256")\`"
            echo
            echo "**Signing certificate SHA-256:** \`$cert\`"
          } > release-notes.md
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "AttendEase-v$VERSION.apk.sha256" \
            --draft --title "AttendEase $VERSION" --notes-file release-notes.md

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
